name: Update the borrowed skills

# Eighteen skills in core/skills/ are copied unchanged from their sources (all MIT):
# from https://github.com/obra/superpowers: brainstorming, systematic-debugging,
#   test-driven-development, verification-before-completion;
# from https://github.com/mattpocock/skills: grilling, codebase-design,
#   improve-codebase-architecture;
# from https://github.com/emilkowalski/skills: mobile-native, break-ui, animate,
#   review-animations, animation-performance, find-animation-opportunities, improve-animations,
#   apple-design, prototype, emil-design-eng, animation-vocabulary.
# This keeps them up to date with their sources. Runs every Monday and when started by hand.
# Only those eighteen folders are touched.
on:
  schedule:
    - cron: "40 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the source
        run: git clone --depth 1 https://github.com/obra/superpowers "$RUNNER_TEMP/superpowers"
      - name: Copy the four skills
        run: |
          for s in brainstorming systematic-debugging test-driven-development verification-before-completion; do
            if [ -d "$RUNNER_TEMP/superpowers/skills/$s" ]; then
              rm -rf "core/skills/$s"
              cp -r "$RUNNER_TEMP/superpowers/skills/$s" "core/skills/$s"
            else
              echo "::warning::$s no longer exists upstream; kept the old copy"
            fi
          done
      - name: Fetch Matt Pocock's skills
        run: git clone --depth 1 https://github.com/mattpocock/skills "$RUNNER_TEMP/mattpocock"
      - name: Copy the three skills
        run: |
          for s in productivity/grilling engineering/codebase-design engineering/improve-codebase-architecture; do
            n=$(basename "$s")
            if [ -d "$RUNNER_TEMP/mattpocock/skills/$s" ]; then
              rm -rf "core/skills/$n"
              cp -r "$RUNNER_TEMP/mattpocock/skills/$s" "core/skills/$n"
            else
              echo "::warning::$s no longer exists upstream; kept the old copy"
            fi
          done
      - name: Fetch Emil Kowalski's skills
        run: git clone --depth 1 https://github.com/emilkowalski/skills "$RUNNER_TEMP/emil"
      - name: Copy the eleven skills
        run: |
          for s in mobile-native break-ui animate review-animations animation-performance \
                   find-animation-opportunities improve-animations apple-design prototype \
                   emil-design-eng animation-vocabulary; do
            if [ -d "$RUNNER_TEMP/emil/skills/$s" ]; then
              rm -rf "core/skills/$s"
              cp -r "$RUNNER_TEMP/emil/skills/$s" "core/skills/$s"
            else
              echo "::warning::$s no longer exists upstream; kept the old copy"
            fi
          done
      - name: Land the change, if there is one
        run: |
          git add -A core/skills
          if git diff --cached --quiet; then echo "Already up to date."; exit 0; fi
          SHA=$(git -C "$RUNNER_TEMP/superpowers" rev-parse --short HEAD)
          git config user.name "Keeper skills update"
          git config user.email "keeper-skills@users.noreply.github.com"
          MP=$(git -C "$RUNNER_TEMP/mattpocock" rev-parse --short HEAD)
          EK=$(git -C "$RUNNER_TEMP/emil" rev-parse --short HEAD)
          git commit -m "Borrowed skills updated to obra/superpowers $SHA, mattpocock/skills $MP and emilkowalski/skills $EK"
          git push -q
